services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - library-postgres-data:/var/lib/postgresql/data

volumes:
  library-postgres-data:
